<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 824" width="760" height="824" role="img" aria-label="Statute search: two to four ranked lists are fused, reranked and diversified; below a calibrated score it abstains instead of guessing." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Statute search: two to four ranked lists are fused, reranked and diversified; below a calibrated score it abstains instead of guessing.</title><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c665e"/></marker><marker id="head-deep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"/></marker><marker id="head-safety" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="head-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker></defs><rect x="1" y="1" width="758" height="822" rx="16" fill="#fbfaf8" stroke="#e3ded6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="280" y="20" width="200" height="40" rx="20.0" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="44.5" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Question</text><rect x="230" y="90" width="300" height="52" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="113.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Acronym expansion</text><text x="380.0" y="129.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">RTI → Right to Information Act, 2005</text><polyline points="380,60 380,88" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="24" y="182" width="166" height="60" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="107.0" y="209.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Vector search</text><text x="107.0" y="225.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">bge-m3 embeddings</text><polyline points="380,142 380,160 107,160 107,180" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="107,242 107,262 380,262 380,280" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="206" y="182" width="166" height="60" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="289.0" y="209.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Keyword search</text><text x="289.0" y="225.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">BM25 full text</text><polyline points="380,142 380,160 289,160 289,180" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="289,242 289,262 380,262 380,280" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="388" y="182" width="166" height="60" rx="9" fill="#f3eefa" stroke="#7a5ea8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="471.0" y="209.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Named Act only</text><text x="471.0" y="225.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">weight ×2.5 when one is named</text><polyline points="380,142 380,160 471,160 471,180" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="471,242 471,262 380,262 380,280" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="570" y="182" width="166" height="60" rx="9" fill="#f3eefa" stroke="#7a5ea8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="653.0" y="209.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Constitution + 2023 codes</text><text x="653.0" y="225.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">×2.0 for policing questions</text><polyline points="380,142 380,160 653,160 653,180" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="653,242 653,262 380,262 380,280" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="215" y="282" width="330" height="52" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="305.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Weighted rank fusion</text><text x="380.0" y="321.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">merged, then one row per section</text><rect x="215" y="368" width="330" height="52" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="380.0" y="391.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Rerank</text><text x="380.0" y="407.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">Cohere v3.5 reads each section and its citizen questions</text><rect x="215" y="454" width="330" height="52" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="477.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">General law wins near-ties</text><text x="380.0" y="493.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">the BNSS, not the Navy Act, for “can police arrest me”</text><rect x="215" y="540" width="330" height="52" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="563.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Diversify</text><text x="380.0" y="579.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">maximal marginal relevance on the stored vectors</text><rect x="215" y="626" width="330" height="52" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="380.0" y="649.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Confident enough?</text><text x="380.0" y="665.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">best score vs. the calibrated threshold</text><polyline points="380,334 380,366" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="380,420 380,452" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="380,506 380,538" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="380,592 380,624" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="60" y="716" width="250" height="44" rx="22.0" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="185.0" y="742.5" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Top 5 sections → the writer</text><rect x="450" y="716" width="250" height="44" rx="22.0" fill="#fbeceb" stroke="#b3261e" stroke-width="1.4"/><text x="575.0" y="742.5" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Abstain: “nothing on point”</text><polyline points="300,678 300,696 185,696 185,714" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="240" y="690" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">yes</text><polyline points="460,678 460,696 575,696 575,714" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="520" y="690" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">no</text><text x="560" y="386" font-size="11" font-weight="500" fill="#2f5d9e" text-anchor="start">if down: fused order,</text><text x="560" y="400" font-size="11" font-weight="500" fill="#2f5d9e" text-anchor="start">with its own threshold</text><rect x="40" y="790" width="22" height="13" rx="3" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.3"/><text x="68" y="800" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">API call (OpenRouter)</text><rect x="226.29999999999998" y="790" width="22" height="13" rx="3" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.3"/><text x="254.29999999999998" y="800" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">local, on the corpus</text><rect x="406.29999999999995" y="790" width="22" height="13" rx="3" fill="#f3eefa" stroke="#7a5ea8" stroke-width="1.3" stroke-dasharray="5 4"/><text x="434.29999999999995" y="800" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">added only when it applies</text></g></svg>
