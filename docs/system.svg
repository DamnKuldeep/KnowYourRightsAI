<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 584" width="1030" height="584" role="img" aria-label="The system, in order: (1) a question leaves the browser, (2) passes sign-in, spending limits and a queue, (3) reaches the orchestrator, which (4) uses model stages, web tools and statute search, and (5) streams the answer back." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The system, in order: (1) a question leaves the browser, (2) passes sign-in, spending limits and a queue, (3) reaches the orchestrator, which (4) uses model stages, web tools and statute search, and (5) streams the answer back.</title><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c665e"/></marker><marker id="head-deep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"/></marker><marker id="head-safety" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="head-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker></defs><rect x="1" y="1" width="1028" height="582" rx="16" fill="#fbfaf8" stroke="#e3ded6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="212" y="56" width="804" height="360" rx="16" fill="#f1efe9"/><text x="232" y="384" font-size="13" font-weight="700" fill="#6c665e" text-anchor="start">The server</text><text x="232" y="402" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">FastAPI, one process</text><rect x="30" y="72" width="150" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="105.0" y="98.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Browser</text><text x="105.0" y="114.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">HTML + JS</text><rect x="232" y="72" width="150" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="307.0" y="98.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Sign-in</text><text x="307.0" y="114.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">signed cookie</text><rect x="420" y="72" width="150" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="495.0" y="98.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Limits</text><text x="495.0" y="114.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">rate · $ per visitor</text><rect x="608" y="72" width="150" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="683.0" y="98.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Queue</text><text x="683.0" y="114.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">5 at once, then wait</text><rect x="806" y="72" width="190" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="901.0" y="98.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Orchestrator</text><text x="901.0" y="114.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">plan → research → write</text><polyline points="180,101 230,101" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="205" cy="80" r="11" fill="#1f6f5c"/><text x="205" y="84" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><polyline points="382,101 418,101" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="570,101 606,101" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="758,101 804,101" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="781" cy="80" r="11" fill="#1f6f5c"/><text x="781" y="84" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M240 146v8h510v-8" fill="none" stroke="#6c665e" stroke-width="1.3"/><circle cx="420" cy="176" r="11" fill="#1f6f5c"/><text x="420" y="180" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="438" y="180" font-size="12" font-weight="500" fill="#6c665e" text-anchor="start">checks before any money is spent</text><polyline points="901,72 901,30 105,30 105,70" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="420" cy="16" r="11" fill="#1f6f5c"/><text x="420" y="20" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="438" y="20" font-size="12" font-weight="500" fill="#6c665e" text-anchor="start">the answer streams back: steps, sources, then the words</text><polyline points="901,130 901,208" fill="none" stroke="#6c665e" stroke-width="1.5"/><polyline points="500,208 901,208" fill="none" stroke="#6c665e" stroke-width="1.5"/><polyline points="500,208 500,234" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="700,208 700,234" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="901,208 901,234" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="760" cy="186" r="11" fill="#1f6f5c"/><text x="760" y="190" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="778" y="190" font-size="12" font-weight="500" fill="#6c665e" text-anchor="start">what one turn uses</text><rect x="410" y="236" width="180" height="58" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="500.0" y="262.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Model stages</text><text x="500.0" y="278.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">plan · grade · write</text><rect x="610" y="236" width="180" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="700.0" y="262.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Web tools</text><text x="700.0" y="278.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">search · read · navigate</text><rect x="811" y="236" width="180" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="901.0" y="262.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Statute search</text><text x="901.0" y="278.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">meaning + keywords</text><rect x="410" y="340" width="180" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="500.0" y="366.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Model client</text><text x="500.0" y="382.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">routing · failover · cost</text><rect x="811" y="340" width="180" height="58" rx="9" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.4"/><text x="901.0" y="366.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Legal corpus</text><text x="901.0" y="382.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">LanceDB · 38,609 chunks</text><polyline points="500,294 500,338" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="901,294 901,338" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="909" y="321.0" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">reads</text><text x="232" y="482" font-size="13" font-weight="700" fill="#6c665e" text-anchor="start">Outside services</text><text x="232" y="500" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">called over HTTPS</text><rect x="410" y="456" width="180" height="58" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="500.0" y="482.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">Model providers</text><text x="500.0" y="498.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">OpenRouter · NIM backup</text><rect x="610" y="456" width="180" height="58" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="700.0" y="482.0" font-size="14" font-weight="620" fill="#23201c" text-anchor="middle">The public web</text><text x="700.0" y="498.0" font-size="12" font-weight="400" fill="#6c665e" text-anchor="middle">gov sites · search · wiki</text><polyline points="500,398 500,454" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="508" y="431.0" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">chat · embed · rerank</text><polyline points="700,294 700,454" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="708" y="379.0" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">public URLs only</text><rect x="30" y="550" width="22" height="13" rx="3" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.3"/><text x="58" y="560" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">uses a model</text><rect x="159.6" y="550" width="22" height="13" rx="3" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.3"/><text x="187.6" y="560" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">plain code</text><rect x="276.6" y="550" width="22" height="13" rx="3" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.3"/><text x="304.6" y="560" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">outside service</text><rect x="425.1" y="550" width="22" height="13" rx="3" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.3"/><text x="453.1" y="560" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">stored data</text></g></svg>
