<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 572" width="970" height="572" role="img" aria-label="The system: requests pass sign-in, validation, spending guards and a queue before the orchestrator runs a turn and streams it back." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The system: requests pass sign-in, validation, spending guards and a queue before the orchestrator runs a turn and streams it back.</title><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c665e"/></marker><marker id="head-deep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"/></marker><marker id="head-safety" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="head-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker></defs><rect x="1" y="1" width="968" height="570" rx="16" fill="#fbfaf8" stroke="#e3ded6" stroke-width="1.5"/><g transform="translate(0 26)"><rect x="24" y="72" width="170" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="109.0" y="97.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Browser</text><text x="109.0" y="113.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plain HTML + JS</text><rect x="224" y="24" width="500" height="472" rx="13" fill="none" stroke="#b9b2a7" stroke-width="1.4"/><text x="240" y="48" font-size="12" font-weight="650" fill="#6c665e" text-anchor="start">Server · FastAPI, one process</text><rect x="244" y="72" width="200" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="344.0" y="97.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Sign-in</text><text x="344.0" y="113.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">signed cookie, 30 days</text><rect x="244" y="150" width="200" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="344.0" y="175.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Validate</text><text x="344.0" y="191.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">every field bounded</text><rect x="244" y="228" width="200" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="344.0" y="253.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Guards</text><text x="344.0" y="269.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">rate · $ per visitor · $ per day</text><rect x="244" y="306" width="200" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="344.0" y="331.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Admission queue</text><text x="344.0" y="347.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">5 answers at once, then a line</text><rect x="244" y="404" width="200" height="56" rx="9" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.4"/><text x="344.0" y="429.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Spend book</text><text x="344.0" y="445.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">per visitor and per day</text><polyline points="344,128 344,148" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="344,206 344,226" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="344,284 344,304" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="194,100 242,100" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="219" y="92" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">POST</text><rect x="484" y="72" width="220" height="56" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="594.0" y="97.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Orchestrator</text><text x="594.0" y="113.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plan → research → write → verify</text><polyline points="444,334 464,334 464,100 482,100" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="484" y="150" width="220" height="264" rx="11" fill="none" stroke="#d9d3c9" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="594,128 594,148" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="498" y="166" width="192" height="48" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="594.0" y="187.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Model stages</text><text x="594.0" y="203.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plan · grade · write</text><rect x="498" y="226" width="192" height="48" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="594.0" y="247.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Statute search</text><text x="594.0" y="263.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">hybrid, reranked</text><rect x="498" y="286" width="192" height="48" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="594.0" y="307.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Web tools</text><text x="594.0" y="323.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">search · read · navigate</text><rect x="498" y="346" width="192" height="48" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="594.0" y="367.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Model client</text><text x="594.0" y="383.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">routing · failover · cost</text><polyline points="594,72 594,12 109,12 109,70" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="350" y="4" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">SSE: steps, sources, then the answer word by word</text><rect x="790" y="226" width="156" height="48" rx="9" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.4"/><text x="868.0" y="247.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">Legal corpus</text><text x="868.0" y="263.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">LanceDB on disk</text><rect x="790" y="286" width="156" height="48" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="868.0" y="307.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">The web</text><text x="868.0" y="323.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">public URLs only</text><rect x="790" y="346" width="156" height="48" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="868.0" y="367.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">OpenRouter</text><text x="868.0" y="383.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">chat · embed · rerank</text><rect x="790" y="424" width="156" height="48" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="868.0" y="445.0" font-size="12.5" font-weight="620" fill="#23201c" text-anchor="middle">NVIDIA NIM</text><text x="868.0" y="461.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">backup chat</text><polyline points="690,250 788,250" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="747" y="242" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">vector + BM25</text><polyline points="690,310 788,310" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="690,370 788,370" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="747" y="362" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">HTTPS</text><polyline points="690,382 740,382 740,448 788,448" fill="none" stroke="#6c665e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-ink)"/><text x="746" y="418" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">if it fails</text><polyline points="594,414 594,432 446,432" fill="none" stroke="#6c665e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-ink)"/><text x="520" y="450" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">charges each call</text><rect x="40" y="510" width="22" height="13" rx="3" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.3"/><text x="68" y="520" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">uses a model</text><rect x="169.6" y="510" width="22" height="13" rx="3" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.3"/><text x="197.6" y="520" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">plain code</text><rect x="286.6" y="510" width="22" height="13" rx="3" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.3"/><text x="314.6" y="520" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">outside service</text><rect x="435.1" y="510" width="22" height="13" rx="3" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.3"/><text x="463.1" y="520" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">stored state</text></g></svg>
