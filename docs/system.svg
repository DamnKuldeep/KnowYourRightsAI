<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 766" width="960" height="766" role="img" aria-label="The system, in order: a question passes sign-in, spending limits and a queue; the orchestrator runs one turn using model stages, web tools and statute search; the answer streams back." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The system, in order: a question passes sign-in, spending limits and a queue; the orchestrator runs one turn using model stages, web tools and statute search; the answer streams back.</title><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c665e"/></marker><marker id="head-deep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"/></marker><marker id="head-safety" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="head-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker></defs><rect x="1" y="1" width="958" height="764" rx="16" fill="#fbfaf8" stroke="#e3ded6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="40" y="24" width="260" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="170.0" y="49.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Browser</text><text x="170.0" y="65.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plain HTML + JavaScript</text><polyline points="260,80 260,182" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="282" cy="104" r="11" fill="#1f6f5c"/><text x="282" y="108" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="302" y="108" font-size="11.5" font-weight="500" fill="#6c665e" text-anchor="start">your question</text><rect x="28" y="124" width="904" height="484" rx="14" fill="none" stroke="#b9b2a7" stroke-width="1.4"/><text x="912" y="146" font-size="12" font-weight="650" fill="#6c665e" text-anchor="end">Server · FastAPI, one process</text><circle cx="66" cy="166" r="11" fill="#1f6f5c"/><text x="66" y="170" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="84" y="170" font-size="12" font-weight="650" fill="#6c665e" text-anchor="start">Checks before spending</text><rect x="40" y="184" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="170.0" y="210.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Sign-in</text><text x="170.0" y="226.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">signed cookie, when enabled</text><rect x="350" y="184" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="480.0" y="210.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Limits</text><text x="480.0" y="226.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">rate · $ per visitor · $ per day</text><rect x="660" y="184" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="790.0" y="210.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Queue</text><text x="790.0" y="226.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">5 answers at once, then a line</text><polyline points="300,213 348,213" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="610,213 658,213" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="350" y="296" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="480.0" y="322.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Orchestrator</text><text x="480.0" y="338.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plan → research → write → check</text><circle cx="372" cy="325" r="11" fill="#1f6f5c"/><text x="372" y="329" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><polyline points="790.0,242 790.0,325 612,325" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="480.0,354 480.0,382" fill="none" stroke="#6c665e" stroke-width="1.5"/><polyline points="170.0,382 790.0,382" fill="none" stroke="#6c665e" stroke-width="1.5"/><polyline points="170.0,382 170.0,406" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="480.0,382 480.0,406" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="790.0,382 790.0,406" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="480.0" cy="382" r="11" fill="#1f6f5c"/><text x="480.0" y="386" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="40" y="408" width="260" height="58" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="170.0" y="434.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Model stages</text><text x="170.0" y="450.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">plan · grade · write · fact-check</text><rect x="350" y="408" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="480.0" y="434.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Web tools</text><text x="480.0" y="450.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">search · read pages · follow portals</text><rect x="660" y="408" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="790.0" y="434.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Statute search</text><text x="790.0" y="450.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">meaning + keywords, reranked</text><rect x="40" y="516" width="260" height="58" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="170.0" y="542.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Model client</text><text x="170.0" y="558.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">picks a model · fails over · counts cost</text><rect x="660" y="516" width="260" height="58" rx="9" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.4"/><text x="790.0" y="542.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Legal corpus</text><text x="790.0" y="558.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">LanceDB on disk · 38,609 chunks</text><polyline points="170.0,466 170.0,514" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><polyline points="790.0,466 790.0,514" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="800.0" y="494" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">reads</text><polyline points="350,340 14,340 14,52 38,52" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><circle cx="190" cy="327" r="11" fill="#1f6f5c"/><text x="190" y="331" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="208" y="331" font-size="11.5" font-weight="500" fill="#6c665e" text-anchor="start">the answer streams back</text><text x="40" y="634" font-size="12" font-weight="650" fill="#6c665e" text-anchor="start">Outside services</text><rect x="40" y="646" width="260" height="58" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="170.0" y="672.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Model providers</text><text x="170.0" y="688.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">OpenRouter · NVIDIA NIM as backup</text><rect x="350" y="646" width="260" height="58" rx="9" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.4"/><text x="480.0" y="672.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">The public web</text><text x="480.0" y="688.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">government sites · search · Wikipedia</text><polyline points="170.0,574 170.0,644" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="178.0" y="618" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">chat · embeddings · rerank</text><polyline points="480.0,466 480.0,644" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="488.0" y="618" font-size="11" font-weight="500" fill="#6c665e" text-anchor="start">public addresses only</text><rect x="40" y="732" width="22" height="13" rx="3" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.3"/><text x="68" y="742" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">uses a model</text><rect x="169.6" y="732" width="22" height="13" rx="3" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.3"/><text x="197.6" y="742" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">plain code</text><rect x="286.6" y="732" width="22" height="13" rx="3" fill="#e9eff8" stroke="#2f5d9e" stroke-width="1.3"/><text x="314.6" y="742" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">outside service</text><rect x="435.1" y="732" width="22" height="13" rx="3" fill="#f4f2ee" stroke="#8a8378" stroke-width="1.3"/><text x="463.1" y="742" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="start">stored data</text></g></svg>
