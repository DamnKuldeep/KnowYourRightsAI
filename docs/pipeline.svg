<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 816" width="780" height="816" role="img" aria-label="How a question becomes a cited answer. Models plan, grade and write; code runs the search, checks every citation and decides what happens next." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a question becomes a cited answer. Models plan, grade and write; code runs the search, checks every citation and decides what happens next.</title><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c665e"/></marker><marker id="head-deep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ea8"/></marker><marker id="head-safety" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="head-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker></defs><rect x="1" y="1" width="778" height="814" rx="16" fill="#fbfaf8" stroke="#e3ded6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="140" y="24" width="200" height="40" rx="20.0" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="240.0" y="48.5" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Question</text><rect x="90" y="98" width="300" height="56" rx="9" fill="#ffffff" stroke="#b9b2a7" stroke-width="1.4"/><text x="240.0" y="123.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Safety gate</text><text x="240.0" y="139.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">phrase patterns + meaning, before anything else</text><rect x="90" y="188" width="300" height="56" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-wid