 section</text><rect x="494" y="444" width="262" height="56" rx="9" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.4"/><text x="625.0" y="469.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Procedure card</text><text x="625.0" y="485.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">fee · time limit · appeal · portal</text><polyline points="390,472 492,472" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><text x="441.0" y="465.0" font-size="11" font-weight="500" fill="#6c665e" text-anchor="middle">how-to</text><polyline points="625.0,500 625.0,562 392,562" fill="none" stroke="#6c665e" stroke-width="1.5" marker-end="url(#head-ink)"/><rect x="494" y="624" width="262" height="56" rx="9" fill="#f3eefa" stroke="#7a5ea8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="625.0" y="649.0" font-size="13" font-weight="620" fill="#23201c" text-anchor="middle">Self-verify</text><text x="625.0" y="665.0" font-size="11" font-weight="400" fill="#6c665e" text-anchor="middle">web-check fees and deadlines, then rewrite</text><polyline points="390,652 492,652" fill="none" stroke="#7a5ea8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-deep)"/><text x="441.0" y="645.0" font-size="11" font-weight="500" fill="#7a5ea8" text-anchor="middle">deep mode</text><polyline points="625.0,680 625.0,734 342,734" fill="none" stroke="#7a5ea8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-deep)"/><polyline points="90,472 48,472 48,344 88,344" fill="none" stroke="#7a5ea8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-deep)"/><text x="36" y="408" font-size="11" font-weight="500" fill="#7a5ea8" text-anchor="middle" transform="rotate(-90 36 408)">deep: another round while gaps remain</text><rect x="92" y="782" width="22" height="13" rx="3" fill="#e7f1ee" stroke="#1f6f5c" stroke-width="1.3"/><text x="120" y="792" font-size="11.5" font-weight="400" fill="#6c665e" text-anchor="sta