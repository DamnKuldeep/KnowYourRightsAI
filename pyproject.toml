[project]
name = "knowyourrights"
version = "1.0.0"
description = "Plain-language answers about Indian law, with citations to the actual sections."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax for the target version
    "SIM",      # simplifications
    "RUF",      # ruff-specific checks, including stale noqa comments
]
ignore = [
    "RUF001", "RUF002", "RUF003",   # the prose is Indian English with Devanagari and dashes
    "SIM108",                       # a ternary is not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Scripts put the repo root on sys.path before importing the package.
"scripts/*.py" = ["E402"]
