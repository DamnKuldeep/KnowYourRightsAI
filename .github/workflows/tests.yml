name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # The corpus is stored with Git LFS and is not fetched here: the suite needs no network,
      # no API key and no corpus. The one test that checks the live corpus skips itself.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check knowyourrights scripts tests

      - name: Test
        run: pytest -q

      - name: Check the server imports cleanly
        run: python -c "import knowyourrights.server as s; print(s.app.title, s.app.version)"
