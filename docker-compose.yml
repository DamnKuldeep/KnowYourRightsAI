# Run the app in a container:   docker compose up --build
#
# Needs a .env file with OPENROUTER_API_KEY (copy .env.example), and the corpus pulled with
# `git lfs pull`. The corpus is mounted read-only; the runtime directory keeps the caches, the
# usage log, calibrations and each client's spend across restarts.

services:
  app:
    build: .
    image: knowyourrights:latest
    container_name: knowyourrights
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"       # localhost only: put a reverse proxy or tunnel in front
    volumes:
      - ./data:/data:ro
      - ./.runtime:/runtime
    # Nothing is loaded locally, so memory is small; the ceiling leaves room for Chromium.
    deploy:
      resources:
        limits:
          memory: 1500M
